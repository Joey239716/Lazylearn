[package]
name = "stickstudy"
version = "0.2.0"
edition = "2021"
description = "Turn class material into fun, animated, voiced study videos (MP4) with a quiz at the end"

[workspace]
members = [".", "app"]

[lib]
name = "stickstudy"
path = "src/lib.rs"

[[bin]]
name = "stickstudy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
pdf-extract = "0.7"
tiny-skia = "0.11"
ab_glyph = "0.2"
png = "0.17"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
debug = false
