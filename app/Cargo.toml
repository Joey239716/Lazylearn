[package]
name = "lazylearn"
version = "0.1.0"
edition = "2021"
description = "Lazylearn: turn class material into animated study videos (desktop app)"

[[bin]]
name = "lazylearn"
path = "src/main.rs"

[dependencies]
stickstudy = { path = ".." }
gpui-kit = "0.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", default-features = false }
clap = "4"
image = { version = "0.25", default-features = false }
